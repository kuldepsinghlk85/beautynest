version: '3.8'

services:
  beauty-connect:
    image: ${APP_IMAGE}
    ports:
      - "${APP_PORT}:3000"
    env_file:
      - .env
    command: sh /app/bin/start_app.sh
    volumes:
      - "${APP_LOG_PATH}:/app/log"
  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
