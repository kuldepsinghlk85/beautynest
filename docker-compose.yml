version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: beautynest-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: beautynest_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: beautynest-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # 3. NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beautynest-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/beautynest_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: beautynest_super_secret_jwt_token_2026_spa_ladies
      JWT_REFRESH_SECRET: beautynest_refresh_secret_key_2026
      RAZORPAY_KEY_ID: rzp_test_beautynest2026
      RAZORPAY_KEY_SECRET: rzp_secret_beautynest2026
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Customer Website (Next.js 14)
  customer-website:
    build:
      context: ./customer-website
      dockerfile: Dockerfile
    container_name: beautynest-customer-website
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000

  # 5. Admin Web Dashboard (React 18)
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: beautynest-admin-dashboard
    restart: always
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:4000

volumes:
  postgres_data:
  redis_data:
