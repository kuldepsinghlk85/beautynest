services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: beauty_connect_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: beauty-connect-web-web:latest
    build:
      context: .
      dockerfile: .devops/Dockerfile
    restart: unless-stopped
    ports:
      - "3009:3000"
    volumes:
      - .:/app
      - ./storage:/app/storage
      - gem_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/beauty_connect_development
      SECRET_KEY_BASE: beautyconnect_dev_secret_key_base_not_for_production_use_only
      RAILS_LOG_TO_STDOUT: "true"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-ki5nokty}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-335139946867126}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-oVXjxRyYaSzuGVBYC8tXaC2_MnA}"
      CLOUDINARY_FOLDER: "${CLOUDINARY_FOLDER:-beauty_connect}"
      APP_HOST: "${APP_HOST:-localhost:3009}"
      APP_PROTOCOL: "${APP_PROTOCOL:-http}"
      SMTP_ADDRESS: "${SMTP_ADDRESS:-smtp.ethereal.email}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-elna.simonis15@ethereal.email}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-CMQBFykQN8M39bCDXV}"
      SMTP_DOMAIN: "${SMTP_DOMAIN:-ethereal.email}"
      SMTP_AUTH: "${SMTP_AUTH:-plain}"
      SMTP_STARTTLS: "true"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sed -i 's/\r$$//' bin/* 2>/dev/null || true;
             chmod +x bin/* 2>/dev/null || true;
             mkdir -p storage tmp/pids && chmod 777 storage 2>/dev/null || true;
             (bundle check || bundle install) &&
             rm -f tmp/pids/server.pid &&
             bin/rails db:prepare &&
             bin/rails server -b 0.0.0.0 -p 3000"

volumes:
  postgres_data:
  gem_cache:
