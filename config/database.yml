default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "db") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: beauty_connect_development

test:
  <<: *default
  database: beauty_connect_test

production:
  <<: *default
  database: beauty_connect_production
  url: <%= ENV["DATABASE_URL"] %>
